<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>VerveDoc Core - Canvas 渲染测试</title>
  <style>
    html, body { height: 100%; margin: 0; }
    body { display: flex; flex-direction: column; font-family: sans-serif; }
    header { padding: 8px 16px; background: #fff; border-bottom: 1px solid #ddd; }
    header button { margin-right: 8px; padding: 4px 12px; }
    #status { color: #666; font-size: 12px; margin-left: 12px; }
    #editor { flex: 1; background: #e5e5e5; }
  </style>
</head>
<body>
  <header>
    <button id="btn-load">重新加载 test-output.json</button>
    <button id="btn-export">Export JSON</button>
    <button id="btn-bookmarks">查看书签</button>
    <span id="status">初始化…</span>
  </header>
  <div id="editor"></div>
  <script type="module">
    import { DocxEditor } from './src/index.ts'
    import testOutputUrl from '../../test-output.json?url'

    const container = document.getElementById('editor')
    const status = document.getElementById('status')

    // 用空文档初始化
    const empty = { success: true, elements: [{ type: 'text', value: '' }] }
    let editor = new DocxEditor(container, empty)

    async function loadJson() {
      status.textContent = '加载中…'
      const t0 = performance.now()
      const res = await fetch(testOutputUrl)
      if (!res.ok) { status.textContent = `加载失败: HTTP ${res.status}`; return }
      const json = await res.json()
      const tParsed = performance.now()
      const doc = Array.isArray(json?.elements) ? json : { success: true, elements: [] }
      if (Array.isArray(json?.header) || Array.isArray(json?.footer)) {
        doc.sections = {
          ...(doc.sections || {}),
          header: Array.isArray(json.header) ? json.header : [],
          footer: Array.isArray(json.footer) ? json.footer : []
        }
      }
      editor.setDocument(doc)
      const layout = editor.draw.getLayout()
      status.textContent = `加载 ${(tParsed - t0).toFixed(0)}ms · 渲染 ${(performance.now() - tParsed).toFixed(0)}ms · 页数 ${layout?.pages.length}`

      // 打印段高分布诊断（浏览器 F12 控制台）
      if (layout) {
        const heights = []
        for (const p of layout.pages) {
          for (const b of p.blocks) {
            if (b.kind === 'paragraph') {
              const text = (b.lines.flatMap(l => l.inlines).map(i => i.text).join('')).slice(0, 30)
              const firstLine = b.lines[0]
              heights.push({
                id: b.id,
                kind: b.paragraphKind,
                h: b.rect.height.toFixed(1),
                lineX: firstLine ? firstLine.x.toFixed(1) : '',
                lineW: firstLine ? firstLine.width.toFixed(1) : '',
                text
              })
            }
          }
        }
        console.table(heights.slice(0, 40))
      }
    }

    document.getElementById('btn-load').onclick = loadJson
    document.getElementById('btn-export').onclick = () => {
      const out = editor.getDocument()
      console.log('Export:', out)
      const json = JSON.stringify(out, null, 2)
      const blob = new Blob([json], { type: 'application/json' })
      const url = URL.createObjectURL(blob)
      const a = document.createElement('a')
      const ts = new Date().toISOString().replace(/[:.]/g, '-')
      a.href = url
      a.download = `test-export-${ts}.json`
      document.body.appendChild(a)
      a.click()
      document.body.removeChild(a)
      URL.revokeObjectURL(url)
      status.textContent = `导出 ${out.elements.length} 个元素 · ${(json.length / 1024).toFixed(1)} KB`
    }

    document.getElementById('btn-bookmarks').onclick = () => {
      const doc = editor.getDocument()
      const bookmarks = []
      const walk = (list) => {
        if (!Array.isArray(list)) return
        for (const el of list) {
          const marker = el?.extension?.bookmarkMarker
          if (marker && marker.position === 'start') {
            bookmarks.push({ name: marker.name, id: el.id ?? '' })
          }
          if (el.valueList) walk(el.valueList)
          if (el.trList) {
            for (const tr of el.trList) {
              if (tr.tdList) for (const td of tr.tdList) walk(td.value)
            }
          }
        }
      }
      walk(doc.elements)
      walk(doc.sections?.header)
      walk(doc.sections?.footer)
      alert(`书签数量：${bookmarks.length}\n${JSON.stringify(bookmarks, null, 2)}`)
    }

    // 页面加载后立即加载
    loadJson()
  </script>
</body>
</html>
