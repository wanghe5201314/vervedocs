<div class="pw-panel-mask hw-mask">
  <div class="pw-panel hw-panel" role="dialog" aria-modal="true" aria-labelledby="hw-title">
    <div class="pw-panel-title" id="hw-title" data-i18n-key="view.paragraph.link">超链接</div>
    <div class="hw-body">
      <label for="hw-text" data-i18n-key="view.hyperlink.text">显示文字</label>
      <input id="hw-text" type="text" />
      <label for="hw-url" data-i18n-key="view.hyperlink.address">链接地址</label>
      <input id="hw-url" type="url" placeholder="https://" data-i18n-placeholder="view.hyperlink.addressPlaceholder" />
      <div class="hw-error" id="hw-error" role="alert" aria-live="polite"></div>
    </div>
    <div class="pw-panel-actions">
      <button type="button" id="hw-cancel" data-i18n-key="view.common.cancel">取消</button>
      <button type="button" id="hw-ok" data-i18n-key="view.common.confirm">确定</button>
    </div>
  </div>
</div>
