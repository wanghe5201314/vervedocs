packages:
  - 'packages/*' # 主要核心组件包
  - 'plugins/*' # 用于扩展和增强功能的插件
  - 'apps/*' # 用于构建和部署的应用程序
  - 'playground/*'   # 用于测试和演示的 playground 项目

catalog:
  # 语言与类型
  typescript: ~5.6.2
  vue-tsc: ^2.1.8
  '@types/node': ^22.10.0

  # CLI与构建
  vite: ^6.4.3
  '@vitejs/plugin-vue': ^6.0.7
  vite-plugin-dts: ^4.5.4
  eslint: ^10.4.0
  '@eslint/js': ^10.0.1
  typescript-eslint: ^8.59.4
  eslint-plugin-unused-imports: ^4.4.1

  # 运行时
  vue: ^3.5.27
  ant-design-vue: ^4.2.6
  '@ant-design/icons-vue': ^7.0.1
  '@mdi/js': ^7.4.47
