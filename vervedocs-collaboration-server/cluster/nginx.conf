# VerveDocs Nginx 负载均衡配置
#
# 架构:
#   前端连接 ws://127.0.0.1:1234 (不变)
#   Nginx 监听 1234，按路径分流：
#     /dashboard/*  → Monitor 服务 (:9090)
#     /api/heartbeat → Monitor 服务 (:9090)
#     /*             → 协同服务负载均衡 (1235, 1236, ...)
#
# 使用:
#   1. start.bat 启动协同实例 (端口从 1235 开始)
#   2. 将此文件复制到 nginx/conf/nginx.conf
#   3. 按实际实例数修改 upstream collab_backend
#   4. nginx -s reload

worker_processes 2;

events {
    worker_connections 1024;
}

http {
    upstream collab_backend {
        # ip_hash;  # 取消注释启用 IP 粘性会话

        server 127.0.0.1:1235 max_fails=3 fail_timeout=30s;
        server 127.0.0.1:1236 max_fails=3 fail_timeout=30s;
        # server 127.0.0.1:1237 max_fails=3 fail_timeout=30s;
        # server 127.0.0.1:1238 max_fails=3 fail_timeout=30s;

        keepalive 32;
    }

    upstream monitor_backend {
        server 127.0.0.1:9090;
        keepalive 16;
    }

    server {
        listen 1234;
        server_name _;

        location /dashboard/ {
            proxy_pass http://monitor_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /api/heartbeat {
            proxy_pass http://monitor_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location / {
            proxy_pass http://collab_backend;
            proxy_http_version 1.1;

            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }
    }
}
